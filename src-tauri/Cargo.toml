[package]
name = "dustling"
version = "0.1.0"
description = "A tiny housekeeper for your PC"
authors = ["Griseld Islamaj"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dustling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
tauri-winrt-notification = "0.8.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rayon = "1.12.0"
trash = "5.2.9"
notify = "8.2.0"
dirs = "7.0.0"
winreg = "0.56.0"
parking_lot = "0.12.5"
anyhow = "1.0.104"
sysinfo = "0.39.6"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Power"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
